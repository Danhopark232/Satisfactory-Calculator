<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satisfactory Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="database.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="global-summary-container">
        <h2>Overall Summary</h2>
        <div class="global-summary-content">
            <div class="global-leftovers">
                <h3>Leftovers:</h3>
                <ul class="global-leftover-list"></ul>
            </div>
            <div class="global-power">
                <h3>Power Summary:</h3>
                <span class="global-power-usage">Usage: 0 MW</span><br>
                <span class="global-power-production">Production: 0 MW</span><br>
                <span class="global-power-net">Net: 0 MW</span>
            </div>
        </div>
    </div>
    <div class="factory-lines-container">
    </div>
    <button class="add-factory-line-btn">+&nbsp;&nbsp;&nbsp;factory line</button>
    <div class="save-load-reset-container">
        <button class="save-btn">Save</button>
        <button class="load-btn">Load</button>
        <button class="reset-btn">Reset</button>
    </div>
    <div id="save-file-display-bar">Factory version 1</div>
    <input type="file" id="load-file-input" style="display: none;" accept=".json">
</body>
</html>
